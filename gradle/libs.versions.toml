[versions]
# Mismas versiones que el proyecto hermano (app-android-rrss-publisher), ya probadas juntas alli.
agp = "9.3.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
coreKtx = "1.15.0"
# 2.11.0 = ultima estable (comprobado en Google Maven 2026-09-21). El hermano declara "2.9.8", que NO
# existe (esa serie acaba en 2.9.4): alli funciona solo porque otra dependencia sube la version por
# conflicto. Aqui nada la sube, asi que la version fantasma rompio el primer build.
lifecycle = "2.11.0"
activityCompose = "1.11.0"
datastorePreferences = "1.2.1"
coroutines = "1.9.0"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
# Confirmado en mvnrepository.com 2026-09-22: 16.0.1 es la ultima estable (texto latino; el modelo se
# descarga al dispositivo la primera vez, necesita Google Play Services).
mlkitTextRecognition = "16.0.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity ={ group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test ={ group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

[plugins]
# Desde AGP 9.0 el soporte de Kotlin va integrado: NO se aplica "org.jetbrains.kotlin.android".
# Solo los modulos JVM puros usan kotlin-jvm.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
